<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovely Anytime</title>
<meta name="description" content="Sometimes you just want to build something lovely.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Same tokens as the music archive, so the two pages read as one site. */
  :root {
    --cream: #F7F3EC;
    --cream-dark: #EDE8DF;
    --paper: #FCFAF5;
    --ink: #1A1916;
    --ink-mid: #4A4742;
    --ink-light: #8A8680;
    --rule: #DAD4C9;
    --green: #3B5E45;
  }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Faint paper grain, carried over from the archive. */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
  }

  /* ── STAGE ── */
  main {
    position: relative; z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 38px;
    padding: 80px 56px;
    text-align: center;
  }

  .logo { width: 340px; max-width: 76vw; height: auto; display: block; }

  .line {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.5rem, 3.4vw, 2.35rem);
    font-weight: 400;
    line-height: 1.35;
    letter-spacing: -0.015em;
    color: var(--ink);
    max-width: 20ch;
  }
  .line em { font-style: italic; color: var(--ink-mid); }

  /* ── FOOTER ── */
  footer {
    position: relative; z-index: 2;
    border-top: 1px solid var(--rule);
    padding: 26px 56px;
    max-width: 1080px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .foot-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  footer a.foot-link {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-light);
  }

  footer a.foot-link {
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
    transition: color .2s, border-color .2s;
  }
  footer a.foot-link:hover { color: var(--ink); border-bottom-color: var(--ink); }
  footer a.foot-link:focus-visible,
  .door:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; border-radius: 2px; }

  /* ── DOOR ── */
  /* Small and quiet — the way through to the archive. */
  .door { display: block; line-height: 0; padding: 8px; margin: -8px; }
  .door svg { width: 20px; height: auto; display: block; }

  .door-frame { fill: none; stroke: var(--ink-light); stroke-width: 6; transition: stroke .2s; }
  .door-sill  { stroke: var(--ink-light); stroke-width: 6; stroke-linecap: round; transition: stroke .2s; }
  .door-panel {
    transform-box: view-box;
    transform-origin: 15px 80px;
    transition: transform .5s cubic-bezier(.4,0,.2,1);
  }
  .door-panel path { fill: var(--cream); stroke: var(--ink-light); stroke-width: 6; transition: stroke .2s; }
  .door-panel circle { fill: var(--ink-light); transition: fill .2s; }
  .door-glow { opacity: 0; transition: opacity .45s ease; }

  .door:hover .door-frame,
  .door:hover .door-sill,
  .door:hover .door-panel path,
  .door:focus-visible .door-frame,
  .door:focus-visible .door-sill,
  .door:focus-visible .door-panel path { stroke: var(--green); }
  .door:hover .door-panel circle,
  .door:focus-visible .door-panel circle { fill: var(--green); }
  .door:hover .door-panel,
  .door:focus-visible .door-panel { transform: scaleX(0.34); }
  .door:hover .door-glow,
  .door:focus-visible .door-glow { opacity: 1; }

  /* ── RESPONSIVE ── */
  @media (max-width: 720px) {
    main { padding: 64px 24px; gap: 30px; }
    footer {
      padding: 22px 24px;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
    .foot-stack { gap: 12px; }
    .door svg { width: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<main>

  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-label="Lovely Anytime">
    <text x="300" y="90" font-family="'DM Sans','Helvetica Neue',Helvetica,sans-serif" font-size="68" font-weight="400" fill="#1A1916" text-anchor="middle" letter-spacing="-1">LOVELY</text>
    <line x1="180" y1="103" x2="420" y2="103" stroke="#1A1916" stroke-width="0.8"/>
    <text x="300" y="128" font-family="'DM Sans','Helvetica Neue',Helvetica,sans-serif" font-size="13" font-weight="300" fill="#1A1916" text-anchor="middle" letter-spacing="9">ANYTIME</text>
  </svg>

  <p class="line">Sometimes you just want to build something <em>lovely</em>.</p>

</main>

<footer>
  <div class="foot-stack">
    <a class="foot-link" href="work.html">My Work</a>
    <a class="door" href="music.html" aria-label="Open the music archive" title="The Collection">
      <svg viewBox="0 0 100 145" aria-hidden="true">
        <defs>
          <linearGradient id="doorglow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6E8F73"/>
            <stop offset="100%" stop-color="#3B5E45"/>
          </linearGradient>
          <clipPath id="doorway">
            <path d="M15,135 L15,60 A35,35 0 0 1 85,60 L85,135 Z"/>
          </clipPath>
        </defs>
        <g clip-path="url(#doorway)">
          <rect class="door-glow" x="15" y="24" width="70" height="111" fill="url(#doorglow)"/>
          <g class="door-panel">
            <path d="M15,135 L15,60 A35,35 0 0 1 85,60 L85,135 Z"/>
            <circle cx="74" cy="100" r="5"/>
          </g>
        </g>
        <path class="door-frame" d="M15,135 L15,60 A35,35 0 0 1 85,60 L85,135"/>
        <line class="door-sill" x1="7" y1="135" x2="93" y2="135"/>
      </svg>
    </a>
  </div>
</footer>

</body>
</html>
